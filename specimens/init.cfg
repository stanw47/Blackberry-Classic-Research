    mkdir /data/local/tmp 0771 shell shell
    mkdir /data/data 0771 system system
    mkdir /data/app-private 0771 system system
    mkdir /data/app-asec 0700 root root
    mkdir /data/app-lib 0771 system system
    mkdir /data/app 0771 system system
    mkdir /data/property 0700 root root
    mkdir /data/ssh 0750 root shell
    mkdir /data/ssh/empty 0700 root root


    # QNX: Create our own install directory
    mkdir /data/install 0774 root system

    # QNX: filesystem structure for whitelisting and shrimp
    mkdir /data/system 0775 system system       # PackageManagerService typically creates /data/system.
    mkdir /data/system/qnx 0770 system system
    mkdir /data/system/qnx/configs 0770 system system

    # QNX: create filesystem structure for /sdcard
