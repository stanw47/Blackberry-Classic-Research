on init

sysclktz 0

loglevel 9

# setup the global environment
    # QNX: copy on write is good
    export COW 1
    # QNX: GRAPHICS_ROOT is set by the OS, we don't need to set it here unless we're bringing up a device where this isn't properly set yet
    #export GRAPHICS_ROOT /usr/lib/graphics/omap4430
    # QNX: export EGL_PLATFORM so that the simulator's EGL drivers know to use android native windows
    export EGL_PLATFORM android
    # QNX: Set the downloads directory to point to our custom one instead of the default /cache
    export DOWNLOAD_CACHE /data/cache
    # QNX: uncomment the following lines to set adb logging to slog2.
    #export QNX_ANDROID_LOG_TO_SLOG2 1

    export PATH /sbin:/system/sbin:/system/bin:/system/xbin
    # QNX: LD_LIBRARY_PATH is set by the OS and android's environment APIs don't support appending to env variables
    # using $, e.g. export LD_LIBRARY_PATH=/system/lib:$LD_LIBRARY_PATH, so instead we explicitly update LD_LIBRARY_PATH
    # in app_launcher and load it in init.
    #export LD_LIBRARY_PATH /system/lib:/proc/boot:/lib:/usr/lib:/lib/dll
    #export ANDROID_BOOTLOGO 1
    export ANDROID_ROOT /system
    export ANDROID_ASSETS /system/app
    export ANDROID_DATA /data
    export ASEC_MOUNTPOINT /mnt/sdcard
    export EXTERNAL_STORAGE /mnt/sdcard
    #export LOOP_MOUNTPOINT /mnt/obb
    export BOOTCLASSPATH /system/framework/core.jar:/system/framework/core-junit.jar:/system/framework/bouncycastle.jar:/system/framework/ext.jar:/system/framework/framework.jar:/system/framework/telephony-common.jar:/system/framework/voip-common.jar:/system/framework/mms-common.jar:/system/framework/android.policy.jar:/system/framework/services.jar:/system/framework/apache-xml.jar

