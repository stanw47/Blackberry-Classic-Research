    #chmod 0440 /proc/kmsg
    #chown root system /proc/sysrq-trigger
    #chmod 0220 /proc/sysrq-trigger

    # create the lost+found directories, so as to enforce our permissions
    mkdir /cache/lost+found 0770 root root

    # QNX: Create our own downloads directory
    mkdir /data/cache 0770 system cache

on post-fs-data
    # We chown/chmod /data again so because mount is run as root + defaults
    #chown system system /data
    #chmod 0771 /data
    # QNX: ensure the QNX data directory has correct permissions
    chmod 0710 /accounts/1000/appdata/sys.android.gYABgKAOw1czN6neiAT72SGO.ns/data
    # QNX: ensure target of /data link has correct owner and permissions
    chown system system /accounts/1000/appdata/sys.android.gYABgKAOw1czN6neiAT72SGO.ns/data/apdata
    chmod 0771 /accounts/1000/appdata/sys.android.gYABgKAOw1czN6neiAT72SGO.ns/data/apdata
    # QNX: restrict ability to rename and delete files in  tmp directory
    chmod 01770 /accounts/1000/appdata/sys.android.gYABgKAOw1czN6neiAT72SGO.ns/tmp
    # QNX: restrict group write on log directory
    chmod 0750 /accounts/1000/appdata/sys.android.gYABgKAOw1czN6neiAT72SGO.ns/logs

    # Create dump dir and collect dumps.
    # Do this before we mount cache so eventually we can use cache for
    # storing dumps on platforms which do not have a dedicated dump partition.
    mkdir /data/dontpanic 0750 root log

    # QNX: Create our own log directory
    mkdir /data/log 0750 shell log

    # QNX: ensure the log files have the correct ownership
    chown shell log /data/log/death.log
    chown shell log /data/log/death.log.1
    chown shell log /data/log/death.log.2
    chown shell log /data/log/death.log.3
    chown shell log /data/log/death.log.4

    # Create dump dir and collect dumps.
    # Do this before we mount cache so eventually we can use cache for
    # storing dumps on platforms which do not have a dedicated dump partition.
    mkdir /data/dontpanic 0750 root log

